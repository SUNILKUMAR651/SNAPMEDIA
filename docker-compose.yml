version: "3.8"

services:
  video-downloader:
    build:
      context: .
      dockerfile: Dockerfile
    image: snapmedia-downloader:latest
    container_name: snapmedia_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - RATE_LIMIT_MAX_REQUESTS=40
      - RATE_LIMIT_WINDOW_SECONDS=60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
